name: pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/src
          cp web/index.html _site/index.html
          cp web/app.js _site/app.js
          cp web/smileys-ui.js _site/smileys-ui.js
          cp web/style.css _site/style.css
          cp web/toolbar.css _site/toolbar.css
          cp src/converter.js _site/src/converter.js
          cp src/reverse-converter.js _site/src/reverse-converter.js
          cp src/preview.js _site/src/preview.js
          cp src/smileys.js _site/src/smileys.js

          # Rewrite repo-relative imports for Pages, then version the full module graph.
          sed -i 's#../src/#./src/#g' _site/app.js
          sed -i 's#../src/#./src/#g' _site/smileys-ui.js
          sed -i "s#./src/converter.js#./src/converter.js?v=${GITHUB_SHA}#" _site/app.js
          sed -i "s#./src/reverse-converter.js#./src/reverse-converter.js?v=${GITHUB_SHA}#" _site/app.js
          sed -i "s#./src/preview.js#./src/preview.js?v=${GITHUB_SHA}#" _site/app.js
          sed -i "s#./src/smileys.js#./src/smileys.js?v=${GITHUB_SHA}#" _site/smileys-ui.js
          sed -i "s#./smileys.js#./smileys.js?v=${GITHUB_SHA}#" _site/src/preview.js

          # Version browser entry points and styles too.
          sed -i "s#./app.js#./app.js?v=${GITHUB_SHA}#" _site/index.html
          sed -i "s#./smileys-ui.js#./smileys-ui.js?v=${GITHUB_SHA}#" _site/index.html
          sed -i "s#./style.css#./style.css?v=${GITHUB_SHA}#" _site/index.html
          sed -i "s#./toolbar.css#./toolbar.css?v=${GITHUB_SHA}#" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
